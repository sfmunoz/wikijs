apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wikijs.fullname" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ required "route.parent.name missing" .Values.route.parent.name }}
    namespace: {{ required "route.parent.namespace missing" .Values.route.parent.namespace }}
    sectionName: {{ required "route.parent.sectionName missing" .Values.route.parent.sectionName }}
  hostnames:
  - {{ required "route.hostname missing" .Values.route.hostname }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "wikijs.fullname" . }}
      port: 80
