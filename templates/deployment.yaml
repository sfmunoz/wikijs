apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wikijs.fullname" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "wikijs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wikijs.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        - name: {{ .Chart.Name }}-init
          image: ghcr.io/requarks/wiki:{{ .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash","-c"]
          args:
          - |
            #!/bin/bash
            set -o pipefail
            FOLDER="wiki-locales-v2"
            BNAME="6ae319554426796487988435d6c718c4b75db8c6.tar.gz"
            FNAME="/${FOLDER}/${BNAME}"
            URL="https://github.com/requarks/${FOLDER}/archive/${BNAME}"
            SHA256SUM="a66dfa1e330387af5111ca6101d3e9040fbf29792e10cd48ca32b4821a48c450"
            set -x
            date
            if [ ! -f "${FNAME}" ]
            then
              curl -L "$URL" -o "$FNAME"
              date
            fi
            echo "${SHA256SUM}  ${FNAME}" | sha256sum -c
            if [ $? -ne 0 ]
            then
              rm -f "${FNAME}"
              sleep $((5+RANDOM%5))
              exit 1
            fi
            set -e
            tar -xvz --strip-components 1 -C /wiki/data/sideload -f "${FNAME}"
            date
            chown -Rv node:node /wiki/data/sideload
            date
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
          - mountPath: /wiki/data/sideload
            name: wiki-data-sideload
            readOnly: false
          - mountPath: /wiki-locales-v2
            name: wiki-locales-v2
            readOnly: false
      containers:
        - name: {{ .Chart.Name }}
          image: ghcr.io/requarks/wiki:{{ .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - mountPath: /wiki/data/sideload
            name: wiki-data-sideload
            readOnly: true
          - mountPath: /wiki/config.yml
            name: wiki-config
            subPath: config.yml
            readOnly: true
      volumes:
      - name: wiki-data-sideload
        emptyDir: {}
      - name: wiki-config
        secret:
          secretName: {{ include "wikijs.fullname" . }}-config
      - name: wiki-locales-v2
        persistentVolumeClaim:
          claimName: {{ include "wikijs.fullname" . }}
