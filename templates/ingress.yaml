apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wikijs.fullname" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ required "ingress.hostname missing" .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wikijs.fullname" . }}
                port:
                  number: 80
{{- if .Values.ingress.secretName }}
  tls:
    - hosts:
        - {{ required "ingress.hostname missing" .Values.ingress.hostname }}
      secretName: {{ .Values.ingress.secretName }}
{{- end }}
